name: Downhill ISO Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/downhill-iso-apk.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android ARM64 APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libdownhill_bridge.so'
          echo 'ISO selector and ELF inspection only; gameplay not implemented.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: downhill-iso-diagnostic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
