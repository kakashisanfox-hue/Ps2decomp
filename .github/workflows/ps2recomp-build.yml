name: PS2Recomp Host Toolchain
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ps2recomp-build.yml'
jobs:
  build-host-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch upstream source with submodules
        uses: actions/checkout@v4
        with:
          repository: ran-j/PS2Recomp
          submodules: recursive
          path: upstream
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ pkg-config
      - name: Configure recompilation tools only
        run: |
          cmake -S upstream -B upstream/build -G Ninja \
            -DPS2X_BUILD_RUNTIME=OFF \
            -DPS2X_BUILD_TEST=OFF \
            -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_BUILD_RECOMP=ON \
            -DPS2X_BUILD_ANALYZER=ON
      - name: Compile tools
        run: cmake --build upstream/build --parallel 2
      - name: Report executables
        run: |
          find upstream/build -type f -executable | head -80
          echo 'Host toolchain built; no proprietary game binary was used.'
