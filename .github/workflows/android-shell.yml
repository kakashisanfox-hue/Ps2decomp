name: Android Native Shell Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-shell.yml'
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          ls -la "$ANDROID_HOME/cmdline-tools" || true
      - name: Install SDK packages using runner SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager); fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build Android debug APK
        working-directory: android
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Check native ARM64 library and APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk_contents.txt
          grep 'lib/arm64-v8a/libdownhill_bridge.so' /tmp/apk_contents.txt
          echo 'Research shell APK built with ARM64 JNI. No game code or assets included.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-shell-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
