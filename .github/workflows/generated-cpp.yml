name: PS2Recomp Generated C++ Gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generated-cpp.yml'
jobs:
  generated-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ran-j/PS2Recomp
          submodules: recursive
          path: upstream
      - name: Install host build and MIPS assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang lld file
      - name: Compile analyzer and recompiler
        run: |
          cmake -S upstream -B upstream/build -G Ninja -DPS2X_BUILD_RUNTIME=OFF -DPS2X_BUILD_TEST=OFF -DPS2X_BUILD_STUDIO=OFF -DPS2X_BUILD_RECOMP=ON -DPS2X_BUILD_ANALYZER=ON
          cmake --build upstream/build --parallel 2
      - name: Create synthetic MIPS ELF
        run: |
          cat >/tmp/smoke.s <<'EOF'
          .set noreorder
          .text
          .globl _start
          _start:
            addiu $v0, $zero, 42
            jr $ra
            nop
          EOF
          clang --target=mipsel-linux-gnu -c /tmp/smoke.s -o /tmp/smoke.o
          ld.lld -m elf32ltsmip -e _start -Ttext 0x00100000 /tmp/smoke.o -o /tmp/smoke.elf
      - name: Analyze and recompile ELF
        run: |
          ANALYZER=$(find upstream/build -type f -name ps2_analyzer -executable | head -1)
          RECOMP=$(find upstream/build -type f -name ps2_recomp -executable | head -1)
          test -n "$ANALYZER" && test -n "$RECOMP"
          "$ANALYZER" /tmp/smoke.elf /tmp/smoke.toml
          test -s /tmp/smoke.toml
          cat /tmp/smoke.toml
          touch /tmp/ps2recomp-generation-start.marker
          "$RECOMP" /tmp/smoke.toml
      - name: Require freshly generated C++ output
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          config = tomllib.loads(pathlib.Path('/tmp/smoke.toml').read_text())
          print('Analyzer config general:', config.get('general'))
          marker = pathlib.Path('/tmp/ps2recomp-generation-start.marker').stat().st_mtime_ns
          roots = [pathlib.Path('/tmp'), pathlib.Path('upstream')]
          outputs = []
          for root in roots:
              for p in root.rglob('*'):
                  if p.suffix not in ('.cpp', '.cc', '.cxx', '.hpp', '.h'):
                      continue
                  if '.git' in p.parts:
                      continue
                  try:
                      s = p.stat()
                  except OSError:
                      continue
                  if s.st_size > 0 and s.st_mtime_ns > marker:
                      outputs.append((str(p), s.st_size))
          print('Fresh C++ outputs:', outputs[:100])
          if not outputs:
              raise SystemExit('FAIL: PS2Recomp did not produce any nonempty fresh C++ files.')
          with open('/tmp/generated-files.txt', 'w') as f:
              for name, size in outputs:
                  f.write(f'{name} ({size} bytes)\\n')
          PY
          echo 'Fresh nonempty C++ output detected. Android linking remains untested.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload generated C++ manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-generated-cpp-manifest
          path: /tmp/generated-files.txt
          retention-days: 3
      - name: Upload analyzer config
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mips-config
          path: /tmp/smoke.toml
          retention-days: 3
