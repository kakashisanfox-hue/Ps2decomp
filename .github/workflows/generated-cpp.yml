name: PS2Recomp Generated C++ Gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generated-cpp.yml'
jobs:
  generated-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ran-j/PS2Recomp
          submodules: recursive
          path: upstream
      - name: Install host build and MIPS assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang lld file
      - name: Compile analyzer and recompiler
        run: |
          cmake -S upstream -B upstream/build -G Ninja -DPS2X_BUILD_RUNTIME=OFF -DPS2X_BUILD_TEST=OFF -DPS2X_BUILD_STUDIO=OFF -DPS2X_BUILD_RECOMP=ON -DPS2X_BUILD_ANALYZER=ON
          cmake --build upstream/build --parallel 2
      - name: Create synthetic MIPS ELF
        run: |
          cat >/tmp/smoke.s <<'EOF'
          .set noreorder
          .text
          .globl _start
          _start:
            addiu $v0, $zero, 42
            jr $ra
            nop
          EOF
          clang --target=mipsel-linux-gnu -c /tmp/smoke.s -o /tmp/smoke.o
          ld.lld -m elf32ltsmip -e _start -Ttext 0x00100000 /tmp/smoke.o -o /tmp/smoke.elf
      - name: Analyze and recompile ELF
        run: |
          ANALYZER=$(find upstream/build -type f -name ps2_analyzer -executable | head -1)
          RECOMP=$(find upstream/build -type f -name ps2_recomp -executable | head -1)
          test -n "$ANALYZER" && test -n "$RECOMP"
          "$ANALYZER" /tmp/smoke.elf /tmp/smoke.toml
          test -s /tmp/smoke.toml
          cat /tmp/smoke.toml
          "$RECOMP" /tmp/smoke.toml
      - name: Verify generated C++ from configured output
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          config=tomllib.loads(pathlib.Path('/tmp/smoke.toml').read_text())
          print('Config general:', config.get('general'))
          PY
          echo 'Inspect recompilation output files below:'
          find /tmp -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.hpp' \) -printf '%p %s bytes\n' | head -80
          echo 'Synthetic ELF conversion completed; generated output still needs an explicit compile/link test.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Downhill binaries are present.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload analyzer config
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mips-config
          path: /tmp/smoke.toml
          retention-days: 3
