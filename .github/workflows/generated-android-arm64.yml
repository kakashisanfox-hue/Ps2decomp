name: PS2Recomp Generated C++ Android ARM64 Gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generated-android-arm64.yml'
jobs:
  arm64-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ran-j/PS2Recomp
          submodules: recursive
          path: upstream
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang lld python3
      - name: Build host recompilation tools
        run: |
          cmake -S upstream -B upstream/build -G Ninja -DPS2X_BUILD_RUNTIME=OFF -DPS2X_BUILD_TEST=OFF -DPS2X_BUILD_STUDIO=OFF -DPS2X_BUILD_RECOMP=ON -DPS2X_BUILD_ANALYZER=ON
          cmake --build upstream/build --parallel 2
      - name: Generate C++ from synthetic MIPS ELF
        run: |
          cat >/tmp/smoke.s <<'EOF'
          .set noreorder
          .text
          .globl _start
          _start:
            addiu $v0, $zero, 42
            jr $ra
            nop
          EOF
          clang --target=mipsel-linux-gnu -c /tmp/smoke.s -o /tmp/smoke.o
          ld.lld -m elf32ltsmip -e _start -Ttext 0x00100000 /tmp/smoke.o -o /tmp/smoke.elf
          ANALYZER=$(find upstream/build -type f -name ps2_analyzer -executable | head -1)
          RECOMP=$(find upstream/build -type f -name ps2_recomp -executable | head -1)
          "$ANALYZER" /tmp/smoke.elf /tmp/smoke.toml
          "$RECOMP" /tmp/smoke.toml
      - name: Fetch SSE2NEON compatibility headers
        run: |
          git clone --depth 1 https://github.com/DLTcollab/sse2neon.git /tmp/sse2neon
          test -s /tmp/sse2neon/sse2neon.h
      - name: Cross-compile generated C++ to Android ARM64 objects
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tomllib
          config=tomllib.loads(pathlib.Path('/tmp/smoke.toml').read_text())
          out=pathlib.Path(config['general']['output'])
          if not out.is_absolute():
              out=pathlib.Path.cwd()/out
          print('Generated output:', out, flush=True)
          units=sorted(p for p in out.rglob('*.cpp') if p.stat().st_size)
          if not units:
              raise SystemExit('FAIL: no generated C++ translation units')
          ndk_root=os.environ.get('ANDROID_NDK_HOME') or os.environ.get('ANDROID_NDK_ROOT')
          if not ndk_root:
              raise SystemExit('FAIL: no Android NDK in runner environment')
          compilers=list(pathlib.Path(ndk_root).glob('toolchains/llvm/prebuilt/*/bin/aarch64-linux-android26-clang++'))
          if not compilers:
              raise SystemExit('FAIL: Android ARM64 NDK clang++ not found')
          headers=list(pathlib.Path('upstream').rglob('Unimplemented.h'))
          includes=[out, pathlib.Path('upstream/ps2xRuntime/include'),
                    pathlib.Path('upstream/ps2xIOP/include'), pathlib.Path('upstream/ps2xRecomp/include'),
                    pathlib.Path('upstream/third_party'), pathlib.Path('upstream')]
          includes += [h.parent.parent for h in headers if h.parent.name=='Stubs']
          neon=[pathlib.Path('/tmp/sse2neon/sse2neon.h')]
          if not neon[0].is_file():
              raise SystemExit('FAIL: fetched sse2neon.h missing')
          print('sse2neon headers:', [str(p) for p in neon], flush=True)
          includes += [p.parent for p in neon]
          if not neon:
              raise SystemExit('FAIL: sse2neon.h not found for ARM64 compatibility')
          pathlib.Path('/tmp/arm64-objects').mkdir(exist_ok=True)
          for i, unit in enumerate(units):
              obj=pathlib.Path('/tmp/arm64-objects')/f'generated_{i}.o'
              cmd=[str(compilers[0]),'-std=c++20','-DUSE_SSE2NEON','-fPIC','-c',str(unit),'-o',str(obj)]
              for inc in includes:
                  cmd += ['-I',str(inc)]
              print('Compiling',unit, '->',obj,flush=True)
              subprocess.run(cmd,check=True)
              if not obj.exists() or obj.stat().st_size==0:
                  raise SystemExit('FAIL: no ARM64 object output')
          print('PASS: compiled',len(units),'generated C++ files into Android ARM64 objects',flush=True)
          PY
      - name: Test 13 - strict ARM64 shared library link
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          test -n "$NDK"
          CXX=$(find "$NDK/toolchains/llvm/prebuilt" -path '*/bin/aarch64-linux-android26-clang++' -type f | head -1)
          test -x "$CXX"
          test -s /tmp/arm64-objects/generated_0.o
          echo 'Attempting strict shared-library link of generated objects.'
          echo 'Any unresolved runtime symbols MUST fail this gate.'
          "$CXX" -shared -Wl,--no-undefined -Wl,-z,defs \
            /tmp/arm64-objects/*.o -o /tmp/libdownhill_generated_test.so \
            2>&1 | tee /tmp/linker-diagnostics.txt
          test -s /tmp/libdownhill_generated_test.so
          file /tmp/libdownhill_generated_test.so
      - name: Checkout Android application project
        uses: actions/checkout@v4
        with:
          path: project
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Package generated ARM64 shared library into APK
        run: |
          set -euo pipefail
          mkdir -p project/android/app/src/main/jniLibs/arm64-v8a
          cp /tmp/libdownhill_generated_test.so project/android/app/src/main/jniLibs/arm64-v8a/libdownhill_generated_test.so
          cd project/android
          gradle :app:assembleDebug --no-daemon
      - name: Verify APK includes generated ARM64 library
        run: |
          set -euo pipefail
          APK=project/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/test14-apk-contents.txt
          grep -F 'lib/arm64-v8a/libdownhill_generated_test.so' /tmp/test14-apk-contents.txt
          grep -F 'lib/arm64-v8a/libdownhill_bridge.so' /tmp/test14-apk-contents.txt
          echo 'PASS: generated ARM64 library packaged in research APK; no runtime loading or invocation has been verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test 15 - prepare Android load probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/android/app/src/main/java/dev/downhill/nativeport/MainActivity.java')
          source=p.read_text()
          before='static { System.loadLibrary("downhill_bridge"); }'
          after='static { System.loadLibrary("downhill_generated_test"); System.loadLibrary("downhill_bridge"); }'
          if before not in source:
              raise SystemExit('FAIL: expected JNI library loader not found')
          p.write_text(source.replace(before,after))
          print('Added generated library load probe to test-only APK')
          PY
          cd project/android
          gradle :app:assembleDebug --no-daemon
      - name: Test 15 - fast ARM64 ELF and APK loadability preflight
        run: |
          set -euo pipefail
          LIB=/tmp/libdownhill_generated_test.so
          APK=project/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$LIB"
          test -s "$APK"
          python3 - <<'PY'
          import struct, zipfile
          lib='/tmp/libdownhill_generated_test.so'
          apk='project/android/app/build/outputs/apk/debug/app-debug.apk'
          blob=open(lib,'rb').read()
          assert blob[:4]==bytes([0x7f, 0x45, 0x4c, 0x46]), f'Not an ELF file: first bytes={blob[:16].hex()}'
          assert blob[4]==2 and blob[5]==1, 'Expected ELF64 little endian'
          assert struct.unpack_from('<H',blob,16)[0]==3, 'Expected shared object (ET_DYN)'
          assert struct.unpack_from('<H',blob,18)[0]==183, 'Expected AArch64 machine'
          with zipfile.ZipFile(apk) as z:
              name='lib/arm64-v8a/libdownhill_generated_test.so'
              packaged=z.read(name)
              assert packaged[:4]==bytes([0x7f,0x45,0x4c,0x46]), 'APK library is not ELF'
              assert packaged[4]==2 and packaged[5]==1, 'APK library is not ELF64 little-endian'
              assert struct.unpack_from('<H',packaged,16)[0]==3, 'APK library is not ET_DYN'
              assert struct.unpack_from('<H',packaged,18)[0]==183, 'APK library is not AArch64'
              print('Original size:',len(blob),'Packaged size:',len(packaged))
              print('Original SHA256:',__import__('hashlib').sha256(blob).hexdigest())
              print('Packaged SHA256:',__import__('hashlib').sha256(packaged).hexdigest())
              # Android Gradle packaging may strip debug symbols; binary byte equality is not required.
              assert len(packaged)>4096, 'Packaged ELF unexpectedly small'
          print('PASS: both linked and packaged libraries are valid AArch64 ELF shared objects')
          PY
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          READELF=$(find "$NDK/toolchains/llvm/prebuilt" -path '*/bin/llvm-readelf' -type f | head -1)
          test -x "$READELF"
          "$READELF" -h -d "$LIB" | tee /tmp/test15-elf-inspection.txt
          echo 'PASS: fast offline ELF/APK preflight. Runtime dlopen on Android remains UNTESTED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Test 14 research APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test14-synthetic-native-research-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
      - name: Upload linker diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test13-linker-diagnostics
          path: /tmp/linker-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Report
        if: always()
        run: |
          echo 'Test 12 cross-compiles PS2Recomp-generated synthetic ELF C++ into Android ARM64 object files.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Test 13 attempts a strict shared-library link; unresolved PS2 runtime dependencies cause failure.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Test 14 verifies packaging into an APK, NOT loading or executing the generated library.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Test 15 performs fast offline ARM64 ELF/APK validation; does not boot an emulator or prove runtime loading.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is not a playable Downhill build.' >> "$GITHUB_STEP_SUMMARY"
